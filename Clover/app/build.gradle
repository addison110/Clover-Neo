apply plugin: 'com.android.application'

// Code style
apply plugin: 'checkstyle'
task('checkstyle', type: Checkstyle) {
    configFile = rootProject.file('checkstyle.xml')
    source 'src/main/java'
    ignoreFailures = false
    showViolations = true
    include '**/*.java'
    classpath = files()
}


afterEvaluate {
    tasks.findByName('check').dependsOn('checkstyle')
}

/**
 * Gets the short hash of the current commit
 */
def getCommitHash = { ->
    return providers.exec {
        commandLine 'git', 'rev-parse', '--short=8', 'HEAD'
    }.standardOutput.asText.get().trim()
}

android {
    namespace = "org.floens.chan"
    compileSdk = 37

    defaultConfig {
        applicationId = "io.github.addison110.cloverneo"
        minSdk = 23
        targetSdk = 36

        versionName = "v3.0.2"
        // of the format XXYYZZ, where XX is major, YY is minor, ZZ is patch
        // (watch out for octal notation, never start with a 0)
        versionCode = 30002
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
        resValues = true
    }

    lint {
        abortOnError = false
    }

    /*
    If you want to sign releases, make a file in app/keys.properties with the following content:
    keystoreFile=yourkey.store
    keystorePass=pass
    keyAlias=alias
    keyPass=pass
    */

    def hash = getCommitHash()

    File f = file('keys.properties')
    boolean doSign = f.exists()

    if (doSign) {
        Properties props = new Properties()
        InputStream is = new FileInputStream(f)
        props.load(is)

        signingConfigs {
            release {
                storeFile = file(props['keystoreFile'])
                storePassword = props['keystorePass']
                keyAlias = props['keyAlias']
                keyPassword = props['keyPass']
            }
        }

        is.close()
    }

    flavorDimensions = ["default"]
    productFlavors {
        // NOTE: the file provider authority names append to the package name.
        // When changing this also update the authority in the manifest files.

        // The app name refers to the name as displayed on the launcher.
        // the flavor name is appended to the name in the settings.
        "default" {
            dimension = "default"
            resValue "string", "app_name", "Clover Neo"
            resValue "string", "app_flavor_name", ""
            buildConfigField "String", "BUILD_HASH", "\"$hash\""
            // Latest GitHub release, see UpdateApiRequest
            buildConfigField "String", "UPDATE_API_ENDPOINT", "\"https://api.github.com/repos/addison110/Clover-Neo/releases/latest\""
        }

        dev {
            dimension = "default"
            applicationIdSuffix = ".dev"
            resValue "string", "app_name", "Clover Neo dev"
            resValue "string", "app_flavor_name", ""
            buildConfigField "String", "BUILD_HASH", "\"$hash\""
            // No update channel for dev builds
            buildConfigField "String", "UPDATE_API_ENDPOINT", "\"\""

            versionNameSuffix = "-" + hash
        }

        fdroid {
            dimension = "default"
            resValue "string", "app_name", "Clover Neo"
            resValue "string", "app_flavor_name", "F-Droid"
            buildConfigField "String", "BUILD_HASH", "\"$hash\""
            // F-Droid handles updates itself
            buildConfigField "String", "UPDATE_API_ENDPOINT", "\"\""
        }
    }

    buildTypes {
        release {
            if (doSign) {
                signingConfig = signingConfigs.release
            }
            minifyEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard.cfg'
            buildConfigField "boolean", "DEVELOPER_MODE", "false"
        }

        debug {
//            minifyEnabled true
//            proguardFiles 'proguard.cfg'
            buildConfigField "boolean", "DEVELOPER_MODE", "true"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.core:core:1.19.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.annotation:annotation:1.11.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation 'androidx.viewpager:viewpager:1.1.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'androidx.slidingpanelayout:slidingpanelayout:1.2.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.3.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.browser:browser:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'

    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'

    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    //noinspection GradleDependency
    implementation 'com.j256.ormlite:ormlite-core:4.48'
    //noinspection GradleDependency
    implementation 'com.j256.ormlite:ormlite-android:4.48'
    implementation 'org.jsoup:jsoup:1.23.2'
    implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.32'
    implementation 'com.davemorrissey.labs:subsampling-scale-image-view-androidx:3.10.0'
    //noinspection GradleDependency
    implementation 'de.greenrobot:eventbus:2.4.0'
    implementation 'org.nibor.autolink:autolink:0.12.0'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'me.xdrop:fuzzywuzzy:1.4.0'
    implementation 'org.codejargon.feather:feather:1.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.24.0'
}
