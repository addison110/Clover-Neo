name: Release

# Push a tag like v3.1.0 that matches versionName in Clover/app/build.gradle. The signed APK is
# attached to a GitHub release, which the in-app updater of the default flavor reads.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Clover
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches versionName
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle)
          if [ "$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match versionName $version"
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Set up the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::The RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS and RELEASE_KEY_PASSWORD secrets are required"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          {
            echo "keystoreFile=$RUNNER_TEMP/release.p12"
            echo "keystorePass=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPass=$KEY_PASSWORD"
          } > app/keys.properties

      - name: Build the signed release APK
        run: |
          ./gradlew assembleDefaultRelease --console plain
          apk="$RUNNER_TEMP/CloverNeo-$TAG.apk"
          cp app/build/outputs/apk/default/release/app-default-release.apk "$apk"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          if grep -q 'CN=Android Debug' "$RUNNER_TEMP/certs.txt"; then
            echo "::error::The APK is signed with the debug key"
            exit 1
          fi
          echo "APK=$apk" >> "$GITHUB_ENV"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="../.github/release-notes/$TAG.md"
          if [ -f "$notes" ]; then
            gh release create "$TAG" "$APK" --title "Clover Neo $TAG" --notes-file "$notes"
          else
            gh release create "$TAG" "$APK" --title "Clover Neo $TAG" --generate-notes
          fi
