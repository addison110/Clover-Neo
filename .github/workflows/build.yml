name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Clover
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Check and build debug APKs
        run: ./gradlew check assembleDebug --console plain

      - uses: actions/upload-artifact@v7
        with:
          name: debug-apks
          path: Clover/app/build/outputs/apk/*/debug/*.apk
