name: Build

on:
  push:
    branches: [dev]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']

# A new push to a pull request cancels the run for the previous one, runs on dev all finish
concurrency:
  group: build-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # Only the release APK, so the emulator tests can start without waiting for the checks
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Clover
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      # Without the release key the release APK is signed with the debug key, so the
      # smoke test can run the minified build that ships
      - name: Build the release APK
        run: ./gradlew assembleDefaultRelease --console plain

      - uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: Clover/app/build/outputs/apk/default/release/*.apk

  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Clover
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Check and build the debug APKs
        run: ./gradlew check assembleDebug --console plain

      - uses: actions/upload-artifact@v7
        with:
          name: debug-apks
          path: Clover/app/build/outputs/apk/*/debug/*.apk

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported, edge-to-edge enforcement, current target
        api-level: [23, 35, 36]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: release-apk
          path: apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The download of the system image is sometimes corrupt, the emulator step then fails
      # before the emulator starts
      - name: Install the system image
        run: |
          image="system-images;android-${{ matrix.api-level }};google_apis;x86_64"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$sdkmanager" ] || sdkmanager=sdkmanager
          for attempt in 1 2 3; do
            yes | "$sdkmanager" --install "$image" > /dev/null || true
            if [ -f "$ANDROID_HOME/system-images/android-${{ matrix.api-level }}/google_apis/x86_64/system.img" ]; then
              exit 0
            fi
            echo "Download $attempt failed, trying again"
            "$sdkmanager" --uninstall "$image" > /dev/null || true
            sleep 10
          done
          exit 1

      # A snapshot of the booted emulator, it then starts in seconds instead of booting from
      # scratch. Bump v1 to throw the cached snapshots away.
      - name: Cache the emulator
        id: avd-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-v1

      - name: Boot the emulator once to save its snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Saved the snapshot"

      - name: Run smoke test on the emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/smoke-test.sh apks/app-default-release.apk smoke-test-results

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-test-api-${{ matrix.api-level }}
          path: smoke-test-results

  import-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: release-apk
          path: apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The download of the system image is sometimes corrupt, the emulator step then fails
      # before the emulator starts
      - name: Install the system image
        run: |
          image="system-images;android-35;google_apis;x86_64"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$sdkmanager" ] || sdkmanager=sdkmanager
          for attempt in 1 2 3; do
            yes | "$sdkmanager" --install "$image" > /dev/null || true
            if [ -f "$ANDROID_HOME/system-images/android-35/google_apis/x86_64/system.img" ]; then
              exit 0
            fi
            echo "Download $attempt failed, trying again"
            "$sdkmanager" --uninstall "$image" > /dev/null || true
            sleep 10
          done
          exit 1

      # A snapshot of the booted emulator, it then starts in seconds instead of booting from
      # scratch. Bump v1 to throw the cached snapshots away.
      - name: Cache the emulator
        id: avd-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-35-v1

      - name: Boot the emulator once to save its snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Saved the snapshot"

      # Imports an adb backup of the original Clover app
      - name: Run import test on the emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/import-test.sh apks/app-default-release.apk import-test-results

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: import-test
          path: import-test-results
